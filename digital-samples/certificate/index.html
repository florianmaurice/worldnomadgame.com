<head>

<body>
	<div id="header-placeholder"></div>


  <main class="wrap">
    <section class="hero">
      <h1 style="text-align: center;">Редактируемые шаблоны сертификатов</h1>
      <div style="text-align: center; max-width: 100vw;" class="sub">Изучите профессионально разработанные шаблоны сертификатов с гибкими макетами. Выберите подходящий дизайн и легко настройте его под свой проект.</div>
    </section>

    <section class="grid">

      
<article class="product-card">
    <a href="psd.html" class="product-card-image">
        <img src="assets/images/psd.jpg" alt="Шаблон свидетельства о рождении в Калифорнии (PSD) [Идентификация ребенка в Калифорнии]" loading="lazy">

    <div class="product-card-content">

                Шаблон свидетельства о рождении в Калифорнии (PSD) [Идентификация ребенка в Калифорнии]

	<div id="footer-placeholder"></div>

	<script>
		document.querySelectorAll('.tab-btn').forEach(btn => {
			btn.addEventListener('click', () => {
				document.querySelectorAll('.tab-btn').forEach(b => {
					b.classList.remove('is-active');
					b.setAttribute('aria-selected', 'false');
				});
				document.querySelectorAll('.tab-panel').forEach(p => {
					p.classList.remove('is-active');
					p.hidden = true;
				});

				btn.classList.add('is-active');
				btn.setAttribute('aria-selected', 'true');

				const panel = document.getElementById('tab-' + btn.dataset.tab);
				panel.classList.add('is-active');
				panel.hidden = false;
			});
		});
	</script>

	<script>
		fetch('/templates/partials/header.html').then(r => r.text()).then(html => {
			document.getElementById('header-placeholder').outerHTML = html;
			initMenu();
		});

		fetch('/templates/partials/footer.html').then(r => r.text()).then(html => {
			document.getElementById('footer-placeholder').outerHTML = html;
		});
	</script>
	<script>
		function initMenu() {
			const hamburgerBtn = document.getElementById('hamburgerBtn');
			const mobileCloseBtn = document.getElementById('mobileCloseBtn');
			const mobileMenu = document.getElementById('mobileMenu');
			const overlay = document.getElementById('overlay');

			function openMenu() {
				mobileMenu.classList.add('is-open');
				overlay.classList.add('is-open');
				hamburgerBtn.classList.add('is-open');
				hamburgerBtn.setAttribute('aria-expanded', 'true');
				document.body.style.overflow = 'hidden';
			}
			function closeMenu() {
				mobileMenu.classList.remove('is-open');
				overlay.classList.remove('is-open');
				hamburgerBtn.classList.remove('is-open');
				hamburgerBtn.setAttribute('aria-expanded', 'false');
				document.body.style.overflow = '';
			}

			hamburgerBtn.addEventListener('click', () => {
				mobileMenu.classList.contains('is-open') ? closeMenu() : openMenu();
			});
			mobileCloseBtn.addEventListener('click', closeMenu);
			overlay.addEventListener('click', closeMenu);
			document.querySelectorAll('.mobile-nav a').forEach(link => {
				link.addEventListener('click', closeMenu);
			});
		}
	</script>
</body>

</html>
